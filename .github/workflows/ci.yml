name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded PR commits can stop; every main commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  synthetic_documents:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/synthetic-documents/requirements.txt

      - name: Install fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
          python -m pip install -r scripts/synthetic-documents/requirements.txt

      - name: Verify synthetic documents and deterministic answer key
        run: python -m unittest discover -s scripts/synthetic-documents/tests -v

  rails_security:
    # ubuntu-26.04 (ubuntu-latest) only ships the newest Ruby patch per series; keep 24.04 until .ruby-version moves past 3.3.7.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api

      - name: Scan Rails code with Brakeman
        run: bin/brakeman --no-pager

      - name: Scan gems with bundler-audit
        run: bin/bundler-audit check --update

  rails_lint:
    # ubuntu-26.04 (ubuntu-latest) only ships the newest Ruby patch per series; keep 24.04 until .ruby-version moves past 3.3.7.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('api/.ruby-version', 'api/.rubocop.yml', 'api/Gemfile.lock') }}
        with:
          path: api/${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint Rails code
        run: bin/rubocop -f github

  # Judges the committed scorecard baselines with the BASE branch's ratchet rules, not the PR's own, so a
  # PR can't loosen lib/scorecard/ratchet.rb and worsen the baselines in the same change. It runs once per
  # PR and the required rails_test job below waits for it.
  # scorecard-ratchet:begin
  scorecard_ratchet:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The check needs Ruby and git only (no gems, Rails or database).
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: api

      - name: Ratchet committed scorecard baselines with the base branch's rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base HEAD "$BASE_SHA")"
          check=api/script/check_scorecard_baselines.rb
          ratchet=api/lib/scorecard/ratchet.rb
          baselines=api/test/fixtures/files/documents/talun-year
          if git cat-file -e "$BASE_SHA:$check" 2>/dev/null && git cat-file -e "$BASE_SHA:$ratchet" 2>/dev/null; then
            # The base commit's own script and ratchet, in a separate tree under RUNNER_TEMP; only the PR's
            # baseline files are copied over it, so they are judged by rules the PR can't change.
            tree="$RUNNER_TEMP/base-scorecard"
            git worktree add --detach "$tree" "$BASE_SHA"
            for name in baseline.json baseline-fast.json; do
              if [ -f "$baselines/$name" ]; then cp "$baselines/$name" "$tree/$baselines/$name"; else rm -f "$tree/$baselines/$name"; fi
            done
            echo "Judging the PR's baselines with the ratchet and check script from $BASE_SHA (merge base $merge_base)."
            cd "$tree"
            ruby "$check" "$merge_base"
          else
            echo "::warning title=Scorecard ratchet::The base commit has no $check or $ratchet, so the PR's own copies judge the baselines."
            ruby "$check" "$merge_base"
          fi

      - name: Require an explanation when the ratchet itself changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base HEAD "$BASE_SHA")"
          changed="$(git diff --name-only "$merge_base" HEAD -- api/lib/scorecard/ratchet.rb api/script/check_scorecard_baselines.rb)"
          # The marked ratchet jobs and steps in this workflow count as part of the ratchet.
          marked() { awk '/^ *# scorecard-ratchet:begin$/{keep=1} keep{print} /^ *# scorecard-ratchet:end$/{keep=0}'; }
          if [ "$(git show "$BASE_SHA:.github/workflows/ci.yml" | marked)" != "$(marked < .github/workflows/ci.yml)" ]; then
            changed="$(printf '%s\n%s\n' "$changed" '.github/workflows/ci.yml (ratchet jobs and steps)')"
          fi
          changed="$(printf '%s' "$changed" | sed '/^$/d')"
          if [ -z "$changed" ]; then
            echo "The ratchet, its check script and its CI steps are unchanged."
            exit 0
          fi
          reason="$(printf '%s\n' "$PR_BODY" | tr -d '\r' | sed -n 's/^Scorecard ratchet change: *//p' | head -1)"
          echo "This PR changes the scorecard ratchet:"
          echo "$changed"
          if [ "${#reason}" -lt 20 ]; then
            echo "::error title=Scorecard ratchet change needs an explanation::Add a line to the PR description that starts with 'Scorecard ratchet change: ' and says why the ratchet may change (at least 20 characters), then re-run this job."
            exit 1
          fi
          echo "Explicit ratchet change: $reason"
  # scorecard-ratchet:end

  # The Rails tests split into shards that run side by side. Each shard has its own database; the file split
  # is deterministic (api/lib/ci_test_shards.rb), so every test file runs in exactly one shard.
  rails_test_shard:
    name: rails_test_shard (${{ matrix.shard }}/3)
    # ubuntu-26.04 (ubuntu-latest) only ships the newest Ruby patch per series; keep 24.04 until .ruby-version moves past 3.3.7.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_TEST_NAME: household_cfo_api_test
    steps:
      - name: Install PostgreSQL client libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev
        working-directory: .

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api

      # The scorecard test compares the report with the committed baseline; on a PR it uses the base commit's
      # ratchet rules for that comparison.
      - name: Fetch the base branch's scorecard ratchet
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git show "$BASE_SHA:api/lib/scorecard/ratchet.rb" > "$RUNNER_TEMP/base-ratchet.rb"; then
            echo "SCORECARD_BASE_RATCHET=$RUNNER_TEMP/base-ratchet.rb" >> "$GITHUB_ENV"
          else
            echo "::warning title=Scorecard ratchet::The base commit has no lib/scorecard/ratchet.rb, so the PR's own copy is used."
          fi

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run this shard's Rails tests
        run: |
          files="$(ruby script/ci_test_shard.rb "${{ matrix.shard }}" 3)"
          echo "$files" | wc -l | xargs echo "Test files in this shard:"
          bin/rails test $files

      - name: Check Zeitwerk autoloading
        if: ${{ matrix.shard == 1 }}
        run: bin/rails zeitwerk:check

  # The required check. Its name stays rails_test so branch protection keeps working; it passes only when
  # every shard and the scorecard ratchet passed (a skipped ratchet is fine only off pull requests).
  rails_test:
    if: ${{ always() }}
    needs:
      # scorecard-ratchet:begin
      - scorecard_ratchet
      # scorecard-ratchet:end
      - rails_test_shard
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Rails test shard
        env:
          SHARDS_RESULT: ${{ needs.rails_test_shard.result }}
        run: test "$SHARDS_RESULT" = success

      # scorecard-ratchet:begin
      - name: Require the scorecard ratchet
        env:
          RATCHET_RESULT: ${{ needs.scorecard_ratchet.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then test "$RATCHET_RESULT" = success; else test "$RATCHET_RESULT" = skipped; fi
      # scorecard-ratchet:end

  # Every browser test mocks the API (web/playwright.config.ts sets VITE_API_BASE_URL=http://api.test), so a
  # change that touches no web file, no root package file and not this workflow can't break them. The
  # browser jobs run on every push to main and on pull requests that change one of those paths.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether the browser tests need to run
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "Not a pull request: the browser tests run."
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$(git merge-base HEAD "$BASE_SHA")" HEAD)"
          echo "Changed files:"
          echo "$files"
          if printf '%s\n' "$files" | grep -Eq '^(web/|\.github/workflows/ci\.yml$|package(-lock)?\.json$|(npm|pnpm|yarn)-lock\.|pnpm-lock\.yaml$|yarn\.lock$)'; then
            echo "A web, workflow or root package file changed: the browser tests run."
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the browser tests depend on changed: they are skipped."
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  web-quality:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Lint web app
        run: npm run lint

      - name: Run design regression checks
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Audit production web dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all web dependencies
        run: node scripts/audit-dependencies.mjs

  web-browser:
    name: web-browser (${{ matrix.target }})
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mobile-webkit
            browser: webkit
            script: test:browser:webkit
            shard: 1/1
          - target: chromium-1
            browser: chrome
            script: test:browser:chromium
            shard: 1/4
          - target: chromium-2
            browser: chrome
            script: test:browser:chromium
            shard: 2/4
          - target: chromium-3
            browser: chrome
            script: test:browser:chromium
            shard: 3/4
          - target: chromium-4
            browser: chrome
            script: test:browser:chromium
            shard: 4/4
    defaults:
      run:
        working-directory: web
    env:
      TZ: UTC
      PLAYWRIGHT_PORT: 6274
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install browser dependencies
        # --with-deps installs system libraries through apt. When the runner can't reach the Ubuntu
        # archive (it happened for hours on 2026-11-12): retry, then switch to another Ubuntu mirror,
        # then install only the browser. The last step is enough for Chromium (the runner image has its
        # libraries; the browser comes from Playwright's CDN) but not for WebKit, which needs apt.
        run: |
          browser='${{ matrix.browser }}'
          # A timed-out attempt can leave sudo apt-get/dpkg running and holding the lock; stop them
          # and finish any half-configured packages before the next attempt.
          clear_apt() {
            sudo pkill -TERM -f '^(/usr/bin/)?(apt-get|dpkg)( |$)' || true
            sleep 5
            sudo pkill -KILL -f '^(/usr/bin/)?(apt-get|dpkg)( |$)' || true
            sudo dpkg --configure -a || true
          }
          try_with_deps() { timeout --kill-after=15 300 npx playwright install --with-deps "$browser"; }
          # apt can hang rather than fail when the archive is unreachable, so each attempt is time-boxed.
          for attempt in 1 2; do
            if try_with_deps; then exit 0; fi
            echo "::warning::playwright install --with-deps failed or timed out (attempt $attempt)"
            clear_apt
            sleep 20
          done
          # WebKit needs system libraries the runner image lacks, so try another Ubuntu mirror before
          # giving up on apt: the outage was DNS for archive.ubuntu.com / azure.archive.ubuntu.com only.
          echo "::warning::Retrying with the mirrors.kernel.org Ubuntu mirror"
          # The runner image points apt at mirror+file:/etc/apt/apt-mirrors.txt, so the Ubuntu hosts live
          # in that list rather than in the sources files; replace it as well.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'http://mirrors.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && sudo sed -i -E 's#https?://(azure\.)?archive\.ubuntu\.com/ubuntu/?#http://mirrors.kernel.org/ubuntu/#g; s#https?://security\.ubuntu\.com/ubuntu/?#http://mirrors.kernel.org/ubuntu/#g' "$f"
          done
          if try_with_deps; then exit 0; fi
          clear_apt
          echo "::warning::Falling back to installing $browser without system packages"
          if timeout --kill-after=15 300 npx playwright install "$browser"; then exit 0; fi
          clear_apt
          # Branded Chrome's installer also uses apt; the runner image ships Google Chrome, so use it.
          if [ "$browser" = chrome ] && command -v google-chrome >/dev/null; then
            echo "::warning::Using the runner image's Google Chrome: $(google-chrome --version)"
            exit 0
          fi
          echo "::error::Could not install $browser"
          exit 1

      - name: Run browser checks
        run: npm run ${{ matrix.script }} -- --shard=${{ matrix.shard }} --workers=1 --reporter=github,blob,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-results.json
          # WebKit's 1/1 and Chromium's 1/4 would both default to report-1.zip and overwrite each other when merged.
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.target }}.zip

      - name: Preserve browser reports and retry traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Stable per-partition name: "Re-run failed jobs" overwrites only the rerun
          # partitions, so the gate always sees the newest report for every partition.
          name: browser-${{ matrix.target }}
          overwrite: true
          path: |
            web/test-results/
            web/blob-report/
            web/playwright-results.json
          retention-days: 7

  web:
    # Preserve the existing required-check name, including failed/skipped jobs.
    if: ${{ always() }}
    needs: [changes, web-quality, web-browser]
    runs-on: ubuntu-latest
    env:
      BROWSER_RAN: ${{ needs.changes.outputs.web == 'true' }}
    steps:
      - name: Checkout code
        if: ${{ !cancelled() && needs.changes.outputs.web == 'true' }}
        uses: actions/checkout@v6

      # The browser jobs may be skipped only when the changes job ran and said nothing they depend on changed.
      # A failed or cancelled browser job, or a failed changes job, always fails this check.
      - name: Require all web jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.web-quality.result }}
          BROWSER_RESULT: ${{ needs.web-browser.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$QUALITY_RESULT" = success
          if [ "$BROWSER_RAN" = true ]; then
            test "$BROWSER_RESULT" = success
          else
            test "$BROWSER_RESULT" = skipped
            echo "Browser tests skipped: no web, workflow or root package file changed (all browser tests mock the API)."
          fi

      - name: Download browser evidence
        if: ${{ !cancelled() && env.BROWSER_RAN == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: browser-*
          path: browser-evidence

      - name: Check every partition produced a report
        if: ${{ !cancelled() && env.BROWSER_RAN == 'true' }}
        run: |
          for target in mobile-webkit chromium-1 chromium-2 chromium-3 chromium-4; do
            test -s "browser-evidence/browser-$target/playwright-results.json"
            compgen -G "browser-evidence/browser-$target/blob-report/*.zip" > /dev/null
          done

      - name: Set up Node
        if: ${{ !cancelled() && env.BROWSER_RAN == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Merge browser reports
        if: ${{ !cancelled() && env.BROWSER_RAN == 'true' }}
        run: |
          npm ci --prefix web
          mkdir -p all-blob-reports
          find browser-evidence -path '*/blob-report/*.zip' -exec cp {} all-blob-reports/ \;
          cd web
          npx playwright merge-reports --reporter=html ../all-blob-reports

      - name: Preserve merged browser report
        if: ${{ !cancelled() && env.BROWSER_RAN == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Named outside the browser-* download pattern; overwritten on reruns.
          name: merged-browser-report
          overwrite: true
          path: web/playwright-report/
          retention-days: 7
