name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded PR commits can stop; every main commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rails_security:
    # ubuntu-26.04 (ubuntu-latest) only ships the newest Ruby patch per series; keep 24.04 until .ruby-version moves past 3.3.7.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api

      - name: Scan Rails code with Brakeman
        run: bin/brakeman --no-pager

      - name: Scan gems with bundler-audit
        run: bin/bundler-audit check --update

  rails_lint:
    # ubuntu-26.04 (ubuntu-latest) only ships the newest Ruby patch per series; keep 24.04 until .ruby-version moves past 3.3.7.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('api/.ruby-version', 'api/.rubocop.yml', 'api/Gemfile.lock') }}
        with:
          path: api/${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint Rails code
        run: bin/rubocop -f github

  rails_test:
    # ubuntu-26.04 (ubuntu-latest) only ships the newest Ruby patch per series; keep 24.04 until .ruby-version moves past 3.3.7.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_TEST_NAME: household_cfo_api_test
    steps:
      - name: Install PostgreSQL client libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev
        working-directory: .

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run Rails tests
        run: bin/rails test

      - name: Check Zeitwerk autoloading
        run: bin/rails zeitwerk:check

  web-quality:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Lint web app
        run: npm run lint

      - name: Run design regression checks
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Audit web dependencies
        run: npm audit --audit-level=moderate

  web-browser:
    name: web-browser (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mobile-webkit
            browser: webkit
            script: test:browser:webkit
            shard: 1/1
          - target: chromium-1
            browser: chrome
            script: test:browser:chromium
            shard: 1/4
          - target: chromium-2
            browser: chrome
            script: test:browser:chromium
            shard: 2/4
          - target: chromium-3
            browser: chrome
            script: test:browser:chromium
            shard: 3/4
          - target: chromium-4
            browser: chrome
            script: test:browser:chromium
            shard: 4/4
    defaults:
      run:
        working-directory: web
    env:
      TZ: UTC
      PLAYWRIGHT_PORT: 6274
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install browser dependencies
        # --with-deps installs system libraries through apt. When the runner can't reach the Ubuntu
        # archive (it happened for hours on 2026-11-12): retry, then switch to another Ubuntu mirror,
        # then install only the browser. The last step is enough for Chromium (the runner image has its
        # libraries; the browser comes from Playwright's CDN) but not for WebKit, which needs apt.
        run: |
          browser='${{ matrix.browser }}'
          # A timed-out attempt can leave sudo apt-get/dpkg running and holding the lock; stop them
          # and finish any half-configured packages before the next attempt.
          clear_apt() {
            sudo pkill -TERM -f '^(/usr/bin/)?(apt-get|dpkg)( |$)' || true
            sleep 5
            sudo pkill -KILL -f '^(/usr/bin/)?(apt-get|dpkg)( |$)' || true
            sudo dpkg --configure -a || true
          }
          try_with_deps() { timeout --kill-after=15 300 npx playwright install --with-deps "$browser"; }
          # apt can hang rather than fail when the archive is unreachable, so each attempt is time-boxed.
          for attempt in 1 2; do
            if try_with_deps; then exit 0; fi
            echo "::warning::playwright install --with-deps failed or timed out (attempt $attempt)"
            clear_apt
            sleep 20
          done
          # WebKit needs system libraries the runner image lacks, so try another Ubuntu mirror before
          # giving up on apt: the outage was DNS for archive.ubuntu.com / azure.archive.ubuntu.com only.
          echo "::warning::Retrying with the mirrors.kernel.org Ubuntu mirror"
          # The runner image points apt at mirror+file:/etc/apt/apt-mirrors.txt, so the Ubuntu hosts live
          # in that list rather than in the sources files; replace it as well.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'http://mirrors.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && sudo sed -i -E 's#https?://(azure\.)?archive\.ubuntu\.com/ubuntu/?#http://mirrors.kernel.org/ubuntu/#g; s#https?://security\.ubuntu\.com/ubuntu/?#http://mirrors.kernel.org/ubuntu/#g' "$f"
          done
          if try_with_deps; then exit 0; fi
          clear_apt
          echo "::warning::Falling back to installing $browser without system packages"
          if timeout --kill-after=15 300 npx playwright install "$browser"; then exit 0; fi
          clear_apt
          # Branded Chrome's installer also uses apt; the runner image ships Google Chrome, so use it.
          if [ "$browser" = chrome ] && command -v google-chrome >/dev/null; then
            echo "::warning::Using the runner image's Google Chrome: $(google-chrome --version)"
            exit 0
          fi
          echo "::error::Could not install $browser"
          exit 1

      - name: Run browser checks
        run: npm run ${{ matrix.script }} -- --shard=${{ matrix.shard }} --workers=1 --reporter=github,blob,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-results.json
          # WebKit's 1/1 and Chromium's 1/4 would both default to report-1.zip and overwrite each other when merged.
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.target }}.zip

      - name: Preserve browser reports and retry traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Stable per-partition name: "Re-run failed jobs" overwrites only the rerun
          # partitions, so the gate always sees the newest report for every partition.
          name: browser-${{ matrix.target }}
          overwrite: true
          path: |
            web/test-results/
            web/blob-report/
            web/playwright-results.json
          retention-days: 7

  web:
    # Preserve the existing required-check name, including failed/skipped jobs.
    if: ${{ always() }}
    needs: [web-quality, web-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        if: ${{ !cancelled() }}
        uses: actions/checkout@v6

      - name: Require all web jobs
        env:
          QUALITY_RESULT: ${{ needs.web-quality.result }}
          BROWSER_RESULT: ${{ needs.web-browser.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BROWSER_RESULT" = success

      - name: Download browser evidence
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          pattern: browser-*
          path: browser-evidence

      - name: Check every partition produced a report
        if: ${{ !cancelled() }}
        run: |
          for target in mobile-webkit chromium-1 chromium-2 chromium-3 chromium-4; do
            test -s "browser-evidence/browser-$target/playwright-results.json"
            compgen -G "browser-evidence/browser-$target/blob-report/*.zip" > /dev/null
          done

      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Merge browser reports
        if: ${{ !cancelled() }}
        run: |
          npm ci --prefix web
          mkdir -p all-blob-reports
          find browser-evidence -path '*/blob-report/*.zip' -exec cp {} all-blob-reports/ \;
          cd web
          npx playwright merge-reports --reporter=html ../all-blob-reports

      - name: Preserve merged browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Named outside the browser-* download pattern; overwritten on reruns.
          name: merged-browser-report
          overwrite: true
          path: web/playwright-report/
          retention-days: 7
