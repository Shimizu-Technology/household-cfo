# Runs the Mia evals against the live model every night and keeps the report.
# It is the only CI context the live runner accepts (MIA_LIVE_EVALS_NIGHTLY_WORKFLOW
# plus this workflow's name); every other CI job is still refused. It never gates a
# PR, but the run goes red when a case fails. Without the OPENROUTER_API_KEY
# repository secret it skips with a notice.
name: Mia live evals (nightly)

on:
  schedule:
    # 14:17 UTC is 00:17 in Guam.
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      set:
        description: Which cases to run
        type: choice
        options: [cfo, default]
        default: cfo
      cases:
        description: Optional comma-separated case ids (blank runs the whole set)
        required: false
        default: ""

concurrency:
  group: mia-live-evals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    # ubuntu-26.04 (ubuntu-latest) only ships the newest Ruby patch per series; keep 24.04 until .ruby-version moves past 3.3.7.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_TEST_NAME: household_cfo_api_test
      MIA_LIVE_EVALS: "1"
      MIA_LIVE_EVALS_NIGHTLY_WORKFLOW: "1"
      SET: ${{ inputs.set || 'cfo' }}
      CASES: ${{ inputs.cases }}
    # The OpenRouter key is set only on the steps that use it, so setup steps and
    # third-party actions never see it.
    steps:
      - name: Check for the OpenRouter key
        id: key
        working-directory: .
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::notice title=Mia live evals skipped::The OPENROUTER_API_KEY repository secret is not set, so no live evals ran. Add the secret to turn this run on."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL client libraries
        if: steps.key.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev
        working-directory: .

      - name: Checkout code
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Ruby
        if: steps.key.outputs.present == 'true'
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true
          working-directory: api

      - name: Prepare database
        if: steps.key.outputs.present == 'true'
        run: bin/rails db:prepare

      - name: Run live Mia evals
        if: steps.key.outputs.present == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # Exits non-zero when a case fails a check its known gap doesn't name, or a model call fails.
        run: bin/rails mia:evals:live

      - name: Add the report to the run summary
        if: ${{ always() && steps.key.outputs.present == 'true' }}
        run: |
          report=$(ls -t tmp/evals/*.md 2>/dev/null | head -1)
          # The totals and the case table; the transcripts stay in the artifact.
          if [ -n "$report" ]; then awk '/^## /{exit} {print}' "$report" >> "$GITHUB_STEP_SUMMARY"; else echo "No live eval report was written." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the report
        if: ${{ always() && steps.key.outputs.present == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mia-live-evals-${{ github.run_id }}
          path: api/tmp/evals/
          if-no-files-found: warn
          retention-days: 30
