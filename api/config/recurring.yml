production:
  recover_document_extraction:
    class: FinancialDocumentExtractionRecoveryJob
    schedule: every 5 minutes
  recover_challenge_reminders:
    class: ChallengeReminderRecoveryJob
    schedule: every 5 minutes
  expire_challenge_source_leases:
    class: ChallengeSourceLeaseExpiryJob
    schedule: every 5 minutes
  recover_document_source_cleanup:
    class: FinancialDocumentSourceCleanupRecoveryJob
    schedule: every 5 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  recover_stale_plaid_items:
    class: PlaidStaleItemRecoveryJob
    schedule: every day at 17:17
  recover_stale_content_source_url_intakes:
    class: CoachContentSourceUrlIntakeRecoveryJob
    schedule: every 5 minutes
  redact_terminal_content_source_url_intakes:
    class: CoachContentSourceUrlIntakeRetentionJob
    schedule: every day at 03:37
