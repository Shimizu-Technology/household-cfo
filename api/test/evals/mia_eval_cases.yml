# Real-world Mia regression prompts.
# These cases are intentionally phrased like a household user would speak or type.
# The harness checks deterministic Rails-owned response paths; it does not require OpenRouter.
# Optional live_expected / live_forbidden apply only to the opt-in live model run
# (bin/rails mia:evals:live). A phrase may be a list (any one counts) or a
# "/regex/" (case-insensitive) for word boundaries. Coaching cases forbid the
# canned "not enough approved data" line in live runs: it means the model reply
# was rejected and Mia fell back instead of coaching.
cases:
  - id: purchase_concert_tickets
    route: controller
    prompt: Can I buy concert tickets?
    expected_phrases:
      - safe-to-spend
      - Next CFO move
    forbidden_phrases:
      - I approved
      - go buy
      - you can definitely

  - id: current_month_spending
    route: controller
    prompt: How much did I spend this month?
    expected_phrases:
      - Jul 1, 2026
      - confirmed spending
      - Pending drafts waiting
    forbidden_phrases:
      - June 2026
      - McDonald's is pending

  - id: june_spending
    route: controller
    prompt: How about June? How did I do in June?
    expected_phrases:
      - June 2026
      - Netlify
      - $20
    forbidden_phrases:
      - July 2026
      - pending McDonald's

  - id: manual_spend_creates_draft
    route: controller
    prompt: I spent $25 at McDonald's.
    expected_phrases:
      - drafted this for review
      - McDonald's
      - $25
      - actuals will not change until you approve
    forbidden_phrases:
      - confirmed this transaction
      - actuals changed

  - id: ambiguous_ignore_followup_fails_safe_without_model
    route: controller_sequence
    messages:
      - I spent $25 at McDonald's.
      - Actually ignore that.
    expected_phrases:
      - Pending drafts total
      - not counted as actuals
    forbidden_phrases:
      - ignored the draft
      - deleted the draft
      - actuals changed

  - id: actuals_guardrail_followup
    route: controller_sequence
    messages:
      - I spent $25 at McDonald's.
      - Did that count as actuals?
    expected_phrases:
      - "No"
      - not counted in actuals
      - until you confirm
    forbidden_phrases:
      - actuals changed
      - confirmed actuals changed

  - id: explicit_bulk_ignore
    route: controller
    prompt: Ignore all pending transaction reviews.
    expected_phrases:
      - Ignored
      - pending Starbucks review
      - Actuals did not change
    forbidden_phrases:
      - deleted
      - actuals were updated

  - id: budget_status
    route: controller
    prompt: Am I over budget?
    expected_phrases:
      - confirmed transactions
      - pending
      - actual
    forbidden_phrases:
      - pending drafts are actuals
      - guaranteed

