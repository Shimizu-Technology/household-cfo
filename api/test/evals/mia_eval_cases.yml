    forbidden_phrases:
      - enough approved data to answer that as a fact
      - ashamed of yourself
      - irresponsible
      - lazy
    live_expected:
      - [pattern, again, fourth, habit, repeat]
      - [next, tomorrow, this week, plan, before]
    live_forbidden:
      - enough approved data to answer that as a fact
      - /\bpar\b/
      - what's wrong with you

